<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>حسابداری هوشمند ساحل</title>

  <!-- تنظیمات PWA برای آیفون و اندروید -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="حسابداری ساحل">
  <meta name="theme-color" content="#4318FF">

  <!-- آیکون برنامه -->
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1MjBP1nitG_R3pTYPfc-BYBwzeuEZs5aO">
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1MjBP1nitG_R3pTYPfc-BYBwzeuEZs5aO">

  <!-- Bootstrap 5 CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --primary-color: #4318FF;
      --bg-gradient: linear-gradient(135deg, #868CFF 0%, #4318FF 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--primary-color);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      color: #fff;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .splash-logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      animation: pulse 2s infinite ease-in-out;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.85; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.85; }
    }

    #page-login {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99998;
      padding: 1.5rem;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 380px;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .login-logo {
      width: 85px;
      height: 85px;
      object-fit: contain;
      margin-bottom: 1rem;
    }

    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.25rem rgba(67, 24, 255, 0.2);
    }

    #main-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #fff;
    }
  </style>
</head>
<body>

  <!-- ۱. صفحه کاور (Splash Screen) -->
  <div id="splash-screen">
    <img src="https://lh3.googleusercontent.com/d/1MjBP1nitG_R3pTYPfc-BYBwzeuEZs5aO" alt="حسابداری ساحل" class="splash-logo mb-3" onerror="this.src='https://via.placeholder.com/110?text=Sahel'">
    <h4 class="fw-bold mb-2">حسابداری هوشمند ساحل</h4>
    <p class="small opacity-75 mb-4">در حال بارگذاری نرم‌افزار...</p>
    <div class="spinner-border text-light spinner-border-sm" role="status"></div>
  </div>

  <!-- ۲. صفحه ورود تزئینی (بدون اعتبارسنجی واقعی — ورود واقعی داخل iframe با OTP انجام می‌شود) -->
  <div id="page-login" class="d-none">
    <div class="login-card">
      <img src="https://lh3.googleusercontent.com/d/1MjBP1nitG_R3pTYPfc-BYBwzeuEZs5aO" alt="حسابداری ساحل" class="login-logo" onerror="this.src='https://via.placeholder.com/85?text=Sahel'">

      <h5 class="fw-bold text-dark mb-1">ورود به سیستم</h5>
      <p class="text-muted small mb-4">حسابداری هوشمند ساحل</p>


      <div class="text-muted mt-4" style="font-size: 0.75rem;">
        نسخه ۴.۸ پرو © ۱۴۰۵ - ساحل کامپیوتر
      </div>
    </div>
  </div>

  <!-- ۳. آی‌فریم اصلی وب‌اپلیکیشن Google Apps Script -->
  <iframe
    id="main-iframe"
    allow="geolocation; microphone; camera">
  </iframe>

  <script>
    // ==========================================================
    // مدیریت نشست ماندگار واقعی (OTP) در سطح این صفحه (top-level).
    // توکن هم در localStorage و هم در خودِ آدرس URL این صفحه
    // نگه‌داری می‌شود تا مستقل از رفتار storage در آیفون باشد.
    // ==========================================================
    const GAS_APP_URL = 'https://script.google.com/macros/s/AKfycbwDATj1muMHYOjXsvmQMfenUJlUVdQFdCpFd0MCHaVSa2hKjR9Fc169MlcyASN78A1XPA/exec';
    const TOKEN_KEY = 'sahel_app_token';

    function getStoredToken() {
      try {
        const urlToken = new URLSearchParams(window.location.search).get('token');
        if (urlToken) {
          saveToken(urlToken);
          return urlToken;
        }
      } catch (e) {}
      try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
    }
    function saveToken(token) {
      try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
    }
    function clearToken() {
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    }
    function buildIframeSrc() {
      const token = getStoredToken();
      const params = new URLSearchParams();
      if (token) params.set('token', token);
      params.set('embedded', '1');
      return GAS_APP_URL + '?' + params.toString();
    }
    function isTrustedOrigin(origin) {
      try {
        return origin === 'https://script.google.com' || /\.googleusercontent\.com$/.test(new URL(origin).hostname);
      } catch (e) {
        return false;
      }
    }

    window.addEventListener('message', function (event) {
      if (!isTrustedOrigin(event.origin)) return;

      const data = event.data;
      if (!data || typeof data !== 'object') return;

      if (data.type === 'SAHEL_AUTH' && data.token) {
        saveToken(data.token);
        try {
          const url = new URL(window.location.href);
          url.searchParams.set('token', data.token);
          window.history.replaceState({}, '', url.toString());
        } catch (e) {}
      } else if (data.type === 'SAHEL_LOGOUT') {
        clearToken();
        try {
          const url = new URL(window.location.href);
          url.searchParams.delete('token');
          window.history.replaceState({}, '', url.toString());
        } catch (e) {}
      }
    });

    document.getElementById('main-iframe').src = buildIframeSrc();

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        splash.style.opacity = '0';
        splash.style.visibility = 'hidden';

        // صفحه‌ی ورود تزئینی (بدون اعتبارسنجی واقعی)
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        if (isLoggedIn !== 'true') {
          document.getElementById('page-login').classList.remove('d-none');
        }
      }, 1500);
    });

    function handleLogin(e) {
      e.preventDefault();
      localStorage.setItem('isLoggedIn', 'true');
      document.getElementById('page-login').classList.add('d-none');
    }
  </script>

</body>
</html>
