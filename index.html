<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>حسابداری هوشمند ساحل</title>

  <!-- تنظیمات PWA برای آیفون و اندروید -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="حسابداری ساحل">
  <meta name="theme-color" content="#4318FF">

  <!-- آیکون برنامه -->
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1MjBP1nitG_R3pTYPfc-BYBwzeuEZs5aO">
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1MjBP1nitG_R3pTYPfc-BYBwzeuEZs5aO">

  <style>
    :root {
      --primary-color: #4318FF;
      --bg-gradient: linear-gradient(135deg, #868CFF 0%, #4318FF 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--primary-color);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      color: #fff;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .splash-logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      animation: pulse 2s infinite ease-in-out;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
      margin-bottom: 16px;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.85; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.85; }
    }

    .splash-hidden {
      opacity: 0;
      visibility: hidden;
    }

    #main-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #fff;
    }
  </style>
</head>
<body>

  <!-- صفحه کاور (Splash Screen) — فقط برای چند لحظه نمایش داده می‌شود -->
  <div id="splash-screen">
    <img src="https://lh3.googleusercontent.com/d/1MjBP1nitG_R3pTYPfc-BYBwzeuEZs5aO" alt="حسابداری ساحل" class="splash-logo" onerror="this.style.display='none'">
    <h4 class="fw-bold mb-2">حسابداری هوشمند ساحل</h4>
    <p class="small" style="opacity:.75; margin-top: 6px;">در حال بارگذاری نرم‌افزار...</p>
  </div>

  <!-- آی‌فریم اصلی وب‌اپلیکیشن Google Apps Script — ورود واقعی (OTP) اینجا انجام می‌شود -->
  <iframe
    id="main-iframe"
    allow="geolocation; microphone; camera">
  </iframe>

  <script>
    // ==========================================================
    // مدیریت نشست ماندگار واقعی (OTP) در سطح این صفحه (top-level).
    // توکن هم در localStorage و هم در خودِ آدرس URL این صفحه
    // نگه‌داری می‌شود تا مستقل از رفتار storage در آیفون باشد.
    // ==========================================================
    const GAS_APP_URL = 'https://script.google.com/macros/s/AKfycbwDATj1muMHYOjXsvmQMfenUJlUVdQFdCpFd0MCHaVSa2hKjR9Fc169MlcyASN78A1XPA/exec';
    const TOKEN_KEY = 'sahel_app_token';

    function getStoredToken() {
      try {
        const urlToken = new URLSearchParams(window.location.search).get('token');
        if (urlToken) {
          saveToken(urlToken);
          return urlToken;
        }
      } catch (e) {}
      try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
    }
    function saveToken(token) {
      try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
    }
    function clearToken() {
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    }
    function buildIframeSrc() {
      const token = getStoredToken();
      const params = new URLSearchParams();
      if (token) params.set('token', token);
      params.set('embedded', '1');
      return GAS_APP_URL + '?' + params.toString();
    }
    function isTrustedOrigin(origin) {
      try {
        return origin === 'https://script.google.com' || /\.googleusercontent\.com$/.test(new URL(origin).hostname);
      } catch (e) {
        return false;
      }
    }

    window.addEventListener('message', function (event) {
      if (!isTrustedOrigin(event.origin)) return;

      const data = event.data;
      if (!data || typeof data !== 'object') return;

      if (data.type === 'SAHEL_AUTH' && data.token) {
        saveToken(data.token);
        try {
          const url = new URL(window.location.href);
          url.searchParams.set('token', data.token);
          window.history.replaceState({}, '', url.toString());
        } catch (e) {}
      } else if (data.type === 'SAHEL_LOGOUT') {
        clearToken();
        try {
          const url = new URL(window.location.href);
          url.searchParams.delete('token');
          window.history.replaceState({}, '', url.toString());
        } catch (e) {}
      }
    });

    const splash = document.getElementById('splash-screen');
    const mainIframe = document.getElementById('main-iframe');

    function hideSplash() {
      splash.classList.add('splash-hidden');
    }

    mainIframe.addEventListener('load', () => {
      setTimeout(hideSplash, 400);
    });
    setTimeout(hideSplash, 3000); // فالبک اطمینان

    mainIframe.src = buildIframeSrc();
  </script>

</body>
</html>
